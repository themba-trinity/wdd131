<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content=" WDD131 | Project review form | Thembinkosi Gumbo | South Africa">
    <meta name="author" content="Thembinkosi Gumbo">
    <title>Product Review Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Roboto:wght@400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html" id="reviewform">
            <div class="form">
                <label for="product">Product Name <span class="required"></span></label>
                <select name="product" id="product" required>
                    <option value="" disabled selected>Select a Product...</option>
                </select>
            </div>
            <fieldset>
                <legend>Overall Rating <span class="required">*</span></legend>
                <div class="option-group">
                    <label for="rating1"><input type="radio" id="rating1" name="rating" value="1" required> 1
                        star</label>
                    <label for="rating2"><input type="radio" id="rating2" name="rating" value="2" required> 2 star</label>
                    <label for="rating3"><input type="radio" id="rating3" name="rating" value="3" required> 3 star</label>
                    <label for="rating4"><input type="radio" id="rating4" name="rating" value="4" required> 4 star</label>
                    <label for="rating5"><input type="radio" id="rating5" name="rating" value="5" required> 5 star</label>
                </div>
            </fieldset>
            <div class="form-group">
                <label for="install-date">Date of Installation <span id="requiered"></span></label>
                <input type="date" id="install-date" name="install-date" required>
            </div>
            <fieldset>
                <legend>Useful features <small>Check all that apply</small></legend>
                <div class="form">
                    <label for="features-durability"><input type="checkbox" id="features-durability" name="features"
                            value="durability">Durability</label>
                    <label for="features-easy"><input type="checkbox" id="features-easy" name="features"
                            value="easy">Easy of use</label>
                    <label for="features-performance"><input type="checkbox" id="features-performance" name="features"
                            value="performance">Performance</label>
                    <label for="features-design"><input type="checkbox" id="features-design" name="features"
                            value="design">Design</label>
                </div>
            </fieldset>
        <div class="form">
            <label for="review">Written Review</label>
            <textarea name="review" id="review" placeholder="Share your experience"></textarea>

        </div>
        <div class="form">
            <label for="username">User Name</label>
            <input type="text" id="username" name="username">

        </div>
        <input type="submit" value="Post Review">
        <p class="counter" id="reviewCounter"></p>
        </form>
    </main>
    <footer>
        <p>&copy;<span id="currentyear"></span>📃Thembinkosi Gumbo📃 South Africa</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>

</html>
